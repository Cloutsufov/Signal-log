      - name: Diagnose every source
        run: |
          set -o pipefail
          python3 scripts/doctor.py 2>&1 | tee doctor_output.txt
        continue-on-error: true

      - name: Retry the equity rail
        run: |
          python3 scripts/fetch_market.py --class equity --symbols SPY,QQQ,IWM \
            2>&1 | tee -a doctor_output.txt
        continue-on-error: true

      - name: Refresh news with the relevance filter
        run: python3 scripts/fetch_news.py 2>&1 | tail -30 | tee -a doctor_output.txt
        continue-on-error: true

      - name: Write HEALTH.md so it can be read from anywhere
        if: always()
        run: |
          {
            echo "# Source health"
            echo
            echo "Generated \`$(date -u +'%Y-%m-%d %H:%M UTC')\`"
            echo
            echo '```'
            cat doctor_output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > HEALTH.md

      - name: Rebuild pages
        if: always()
        run: python3 scripts/build_site.py

      - name: Commit
        if: always()
        run: |
          git config user.name  "signal-log-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "patched providers + news filter, health check"
          git pull --rebase --autostash || true
          git push

      - name: Summary
        if: always()
        run: |
          echo '### Health' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat doctor_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
