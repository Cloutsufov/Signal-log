name: update and diagnose

# KWAN: The first real run told us three things: crypto works, news works, and
# the equity rail fails from a GitHub runner. That last one is the interesting
# failure - it means the free endpoints treat a datacenter IP differently from
# a home IP, which is invisible until you run it somewhere real.
#
# This does three jobs:
#   1. installs the patched scripts (4 equity providers instead of 2, HTTP
#      status codes in every error, and a keyword filter on general news feeds)
#   2. runs the full health check and writes the result to HEALTH.md
#   3. retries the equity fetch and rebuilds the pages
#
# Run it once, then delete this file.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

