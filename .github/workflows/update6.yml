      - name: Refresh and rebuild
        run: |
          python3 scripts/fetch_market.py --class crypto --symbols BTC-USD,ETH-USD
          python3 scripts/make_prompt.py --symbol BTC-USD > /dev/null
          python3 scripts/build_site.py
      - name: Commit
        if: always()
        run: |
          git config user.name  "signal-log-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "record via form fields, not pasted JSON"
          git pull --rebase --autostash || true
          git push
      - name: Summary
        if: always()
        run: |
          echo '### Done' >> $GITHUB_STEP_SUMMARY
          echo 'Now paste the new signal.yml over the old one to get the new form.' >> $GITHUB_STEP_SUMMARY
