name: update 6 - no more JSON

# The daily action is recording a call. It must not be the fragile part.
#
# What went wrong: GitHub's workflow input is a SINGLE-LINE field. Pretty-
# printed JSON pasted into it keeps only the first line, so the entire call
# arrived as "{". The parser correctly refused it - but the form should never
# have been able to eat the input in the first place.
#
# So the form no longer asks for JSON. It asks for a direction (dropdown), a
# confidence (dropdown), and two plain sentences. Nothing to mis-paste.
#
# Two guards added, both tested:
#   - a call supplied while the action is NOT 'record' now FAILS LOUDLY
#     instead of going green and silently discarding it
#   - a truncated "{" input names the exact cause in the error
#
# After this runs, paste the new signal.yml (sent alongside) to get the form.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install patched scripts
