name: update 5 - clear the banners

# One banner was a lie. One was the truth. They get different treatment.
#
# 1. "NO DATA for SPY, QQQ, IWM" - FIXED. The page was claiming to track three
#    symbols it has never once fetched and cannot fetch from this IP. Claiming
#    to track something you don't is worse than not tracking it. They move to
#    "equities_parked": still disclosed on the page, with the reason, but no
#    longer a red alarm. Nothing is deleted - all the equity and option-chain
#    code is untouched and still tested. One line of config brings them back
#    the day a quote key exists.
#
# 2. "DIRECTION-ONLY SCORING" - NOT REMOVED. It is true. Without a chain we
#    genuinely cannot see theta or the spread, and the hit rate genuinely is
#    an upper bound. Deleting a true warning because it is unwelcome is the
#    one change that would make this whole project worthless. It is now shorter
#    and calmer, it says how it clears itself, and it still says the thing.

