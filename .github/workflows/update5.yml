      - name: Snapshot crypto (24h open + daily candles)
        run: python3 scripts/fetch_market.py --class crypto --symbols BTC-USD,ETH-USD 2>&1 | tee out.txt

      - name: Write the prompt with 14 days of real closes
        run: python3 scripts/make_prompt.py --symbol BTC-USD 2>&1 | tail -40 | tee -a out.txt

      - name: News
        run: python3 scripts/fetch_news.py 2>&1 | tail -12 | tee -a out.txt
        continue-on-error: true

      - name: Rebuild pages
        run: python3 scripts/build_site.py 2>&1 | tee -a out.txt

      - name: Write HEALTH.md
        if: always()
        run: |
          {
            echo "# Last run"
            echo
            echo "Generated \`$(date -u +'%Y-%m-%d %H:%M UTC')\`"
            echo
            echo '```'
            cat out.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > HEALTH.md

      - name: Commit
        if: always()
        run: |
          git config user.name  "signal-log-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "park equities, real daily history, calmer degraded notice"
          git pull --rebase --autostash || true
          git push

      - name: Summary
        if: always()
        run: |
          echo '### Ready' >> $GITHUB_STEP_SUMMARY
          echo 'Open PROMPT.md, paste into Claude, then: signal log -> action `record`, symbol `BTC-USD`.' >> $GITHUB_STEP_SUMMARY
