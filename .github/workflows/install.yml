name: install the code

# KWAN: The file upload didn't commit - twice. But pasting a file into GitHub's
# web editor demonstrably works for you, because that's how signal.yml got here.
# So the code arrives as a paste instead of an upload.
#
# The project is embedded below as base64. This workflow unpacks it into the
# repo, verifies every module imports, and commits. Run it once, then delete
# this file - it has done its only job.

