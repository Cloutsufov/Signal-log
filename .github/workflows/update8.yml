      - name: Health check with the repaired feeds
        run: python3 scripts/doctor.py 2>&1 | tail -35 | tee out.txt
        continue-on-error: true
      - name: Refresh, score, rebuild
        run: |
          python3 scripts/fetch_market.py --class crypto --symbols BTC-USD,ETH-USD 2>&1 | tee -a out.txt
          python3 scripts/fetch_news.py 2>&1 | tail -12 | tee -a out.txt
          python3 scripts/score.py 2>&1 | tee -a out.txt
          python3 scripts/make_prompt.py --symbol BTC-USD > /dev/null
          python3 scripts/build_site.py
      - name: Write HEALTH.md
        if: always()
        run: |
          {
            echo "# Last run"
            echo
            echo "Generated \`$(date -u +'%Y-%m-%d %H:%M UTC')\`"
            echo
            echo '```'
            cat out.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > HEALTH.md
      - name: Commit
        if: always()
        run: |
          git config user.name  "signal-log-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "review pass: maturity, flat band, dupe guard, feeds, docs"
          git pull --rebase --autostash || true
          git push
      - name: Summary
        if: always()
        run: |
          echo '### Review pass applied' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
