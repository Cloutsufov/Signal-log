name: update 8 - the review pass

# Nobody asked for a list, so the room made its own. Six things, four of which
# would have quietly corrupted the record before you noticed.
#
# 1. CRYPTO MATURITY (data integrity). Scoring skipped weekends unconditionally
#    - correct for equities, wrong for BTC. A Friday call would not have been
#      graded until Tuesday: three days of movement judged as a one-day call.
#
# 2. FLAT BAND (data integrity). The 0.25% "nothing happened" band was written
#    for SPY, whose daily sigma is ~0.8%. BTC's is 2-3%. Every honest "flat"
#    call would have been graded a miss, and the model would have learned to
#    stop saying flat. The band is now 0.31 sigma of the symbol's OWN realized
#    volatility, the constant is fixed before any call has been scored, and
#    every row records how its band was derived so it can be audited.
#
# 3. DUPLICATE CALLS (data integrity). Nothing stopped two calls for one symbol
#    landing on one day - which double-counts a single opinion. One open call
#    per symbol, refused with a clear message, --force to override.
#
# 4. DEAD PRIMARY FEEDS. BLS 403, Treasury ParseError, BEA 404 - the three
#    sources that publish numbers rather than narrative, all broken. URLs
#    repaired, plus Fed speeches, Fed enforcement, EIA, and Reuters/AP routed
#    through Google News since both retired public RSS. 25 feeds, 9 primary.
#
# 5. THREE EMPTY BOXES. With no option chain, sections 2/3/4 each rendered a
#    card saying "not available". Three empty boxes is not information, it is
#    training you to scroll past that part of the page. They now collapse into
#    one honest line that says what is missing and what would restore it.
#
# 6. THE DOCS LIED. SETUP.md still described SPY, pasted JSON, and a schedule
#    that no longer exists. Documentation that describes a system you don't
#    have is worse than none.
#
# 246 tests, all green.

