name: update 3 - ship what works

# JUNE: Tradier turned out to want a margin brokerage application - SSN,
# funding, sign-and-submit - to hand over a price quote. That is not a trade
# anyone should make, so we are not making it.
#
# Instead: ship the half that works TODAY, with no signup at all.
#
# Coinbase serves crypto from a GitHub runner without complaint. So the primary
# symbol becomes BTC-USD, and you start logging real calls tonight. Crypto runs
# 24/7, which means you accumulate scored calls roughly 5x faster than two
# equity snapshots a day - 30 calls in a week instead of a month.
#
# MARA: with no option chain, scoring is DIRECTION ONLY. That is the flattering
# half of the measurement and the pages now say so, loudly, on every screen.
# Equities and option P&L come back the moment a quote key exists. Nothing is
# thrown away - the code for both is still here and still tested.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
