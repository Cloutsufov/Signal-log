      - name: Fetch crypto (the rail that works)
        run: python3 scripts/fetch_market.py --class crypto --symbols BTC-USD,ETH-USD 2>&1 | tee out.txt

      - name: Try equities anyway (free if a key ever appears)
        run: python3 scripts/fetch_market.py --class equity --symbols SPY,QQQ,IWM 2>&1 | tee -a out.txt
        continue-on-error: true

      - name: News with the relevance filter and history purge
        run: python3 scripts/fetch_news.py 2>&1 | tail -25 | tee -a out.txt
        continue-on-error: true

      - name: Write today's prompt for BTC-USD
        run: python3 scripts/make_prompt.py --symbol BTC-USD 2>&1 | tail -3 | tee -a out.txt

      - name: Rebuild pages
        run: python3 scripts/build_site.py

      - name: Write HEALTH.md
        if: always()
        run: |
          {
            echo "# Last run"
            echo
            echo "Generated \`$(date -u +'%Y-%m-%d %H:%M UTC')\`"
            echo
            echo '```'
            cat out.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > HEALTH.md

      - name: Commit
        if: always()
        run: |
          git config user.name  "signal-log-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "primary symbol -> BTC-USD; direction-only scoring warning"
          git pull --rebase --autostash || true
          git push

      - name: Summary
        if: always()
        run: |
          echo '### Run' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'Next: open PROMPT.md, paste into Claude, then signal log -> record.' >> $GITHUB_STEP_SUMMARY
